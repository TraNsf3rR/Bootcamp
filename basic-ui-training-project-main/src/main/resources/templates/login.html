<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Sign in</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
  <main>
    <h1>Sign in to the Shelter</h1>
    <p class="field-error" role="alert" th:if="${param.error}">Invalid username or password.</p>
    <p class="notice" role="status" th:if="${param.logout}">You have signed out.</p>

    <form th:action="@{/login}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
